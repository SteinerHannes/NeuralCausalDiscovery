# @package _global_
defaults:
  - _base
  - override /data: LinearSEMDataset
  - override /model: ShallowMLP
  - override /causaldiscovery/ci_test: CondIndepParCorr
  - _self_

experiment:
  name: linear_sem_sample_150_shallow_mlp_align

extraction:
  alignment:
    enabled: true

causaldiscovery:
  max_samples: 150
  baseline_max_samples: 150
  sample_sizes: null
  baseline_sample_sizes: null

pipeline:
  run_train: false
  run_test: false
  run_extraction: false
  run_causaldiscovery: true
  run_pag_cleanup: true
  run_interventions: true

reuse:
  enabled: true
  source_experiment: linear_sem_shallow_mlp_align
  mode: symlink
  manifest_file: reuse_manifest.json
  required_fold_files:
    - model.pt
    - extraction_results.csv
    - alignment_results.csv
    - alignment_mapping.npz
    - alignment_metrics.json
