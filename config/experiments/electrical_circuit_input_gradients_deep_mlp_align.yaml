# @package _global_
defaults:
  - _base
  - override /data: ElectricalCircuitData
  - override /model: DeepMLP
  - override /causaldiscovery/ci_test: CondIndepKCI
  - _self_

experiment:
  name: electrical_circuit_input_gradients_deep_mlp_align

extraction:
  method: input_gradients
  alignment:
    enabled: true
    include_prefixes: [input_grad_]
    exclude_prefixes: []

pipeline:
  run_train: false
  run_test: false
  run_extraction: true
  run_causaldiscovery: true
  run_pag_cleanup: true
  run_interventions: true

reuse:
  enabled: true
  source_experiment: electrical_circuit_deep_mlp_align
  mode: symlink
  manifest_file: reuse_manifest.json
  required_fold_files:
    - model.pt
